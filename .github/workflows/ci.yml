name: reproducibility
on: [push, pull_request]
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: kernel tests (incl. bit-level reproduction of a stored run)
        run: make test
      - name: independent audit over the stored networks
        run: make audit
      - name: figures from the stored results
        run: make figures
      - name: the audit reproduces the committed numbers
        run: git diff --exit-code -- audit/u4_u11/a1_network.json audit/u4_u11/a0_units.json
