name: reproducibility
on: [push, pull_request]
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: kernel tests (incl. the reproduction of a stored run; a skipped test fails here)
        run: REQUIRE_ALL=1 make test
      - name: independent audit over the stored networks
        run: make audit
      - name: every number quoted in the paper matches the stored results
        run: make numbers
      - name: figures from the stored results
        run: make figures
      - name: the audit reproduces the committed numbers (to 1e-8, independent of numpy/scipy versions)
        run: |
          git show HEAD:audit/u4_u11/a1_network.json > "$RUNNER_TEMP/a1_ref.json"
          python3 - "$RUNNER_TEMP/a1_ref.json" audit/u4_u11/a1_network.json <<'EOF'
          import json, math, sys
          def walk(a, b, path=""):
              if isinstance(a, dict):
                  assert a.keys() == b.keys(), path
                  for k in a: walk(a[k], b[k], f"{path}.{k}")
              elif isinstance(a, list):
                  assert len(a) == len(b), path
                  for i, (x, y) in enumerate(zip(a, b)): walk(x, y, f"{path}[{i}]")
              elif isinstance(a, float) or isinstance(b, float):
                  if a != a and b != b: return  # both NaN
                  assert math.isclose(a, b, rel_tol=1e-8, abs_tol=1e-12), f"{path}: {a} != {b}"
              else:
                  assert a == b, f"{path}: {a} != {b}"
          walk(*(json.load(open(f)) for f in sys.argv[1:3])); print("audit numbers reproduced")
          EOF
